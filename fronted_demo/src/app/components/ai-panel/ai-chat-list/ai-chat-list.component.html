<div class="chat-list-container" #scrollContainer>

  <div class="chat-empty" *ngIf="messages.length === 0 && !isWaiting">
    <div class="empty-icon">🤖</div>
    <p class="empty-text">你好！我是 AI 数据分析助手</p>
    <p class="empty-hint">请输入问题或使用快速模板开始分析</p>
    <div class="empty-suggestions">
      <span class="suggestion-tag">📊 人员结构分析</span>
      <span class="suggestion-tag">📈 离职趋势分析</span>
      <span class="suggestion-tag">🏭 厂区对比</span>
    </div>
  </div>

  <div *ngFor="let msg of messages"
       class="message-row"
       [class.user-row]="msg.role === 'user'"
       [class.assistant-row]="msg.role === 'assistant'">

    <ng-container *ngIf="msg.role === 'assistant'">
      <div class="avatar ai-avatar">🤖</div>
      <div class="message-bubble ai-bubble">
        <div class="message-content" [innerHTML]="msg.content"></div>
        <div class="message-time" *ngIf="msg.created_at">{{ formatTime(msg.created_at) }}</div>
      </div>
    </ng-container>

    <ng-container *ngIf="msg.role === 'user'">
      <div class="message-bubble user-bubble">
        <div class="message-content">{{ msg.content }}</div>
        <div class="message-time" *ngIf="msg.created_at">{{ formatTime(msg.created_at) }}</div>
      </div>
      <div class="avatar user-avatar">👤</div>
    </ng-container>
  </div>

  <div class="message-row assistant-row" *ngIf="isWaiting">
    <div class="avatar ai-avatar">🤖</div>
    <div class="message-bubble ai-bubble typing-bubble">
      <div class="typing-dots" aria-label="AI 正在思考">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

</div>
