<div class="chat-list-container" #scrollContainer>

  <!-- ★ 改造后的空状态：模板栏嵌入 -->
  <div class="chat-empty" *ngIf="messages.length === 0 && !isWaiting">
    <div class="empty-icon">🤖</div>
    <p class="empty-text">你好！我是 AI 数据分析助手</p>
    <p class="empty-hint">请选择快速分析模板，或在下方输入您的问题</p>

    <!-- ★ 模板栏嵌入到空状态内部 -->
    <app-ai-template-bar [templates]="templates" [loading]="templatesLoading" [disabled]="templatesDisabled"
      (templateSelected)="onTemplateSelect($event)"></app-ai-template-bar>
  </div>

  <!-- 消息列表（不变） -->
  <div *ngFor="let msg of messages; let i = index; trackBy: trackByIndex" class="message-row"
    [class.user-row]="msg.role === 'user'" [class.assistant-row]="msg.role === 'assistant'">

    <ng-container *ngIf="msg.role === 'assistant'">
      <div class="avatar ai-avatar">🤖</div>
      <div class="message-bubble ai-bubble">
        <div class="message-content markdown-body" [innerHTML]="renderedMessages[i]"></div>
        <div class="message-time" *ngIf="msg.created_at">{{ formatTime(msg.created_at) }}</div>
      </div>
    </ng-container>

    <ng-container *ngIf="msg.role === 'user'">
      <div class="message-bubble user-bubble">
        <div class="message-content">{{ msg.content }}</div>
        <div class="message-time" *ngIf="msg.created_at">{{ formatTime(msg.created_at) }}</div>
      </div>
      <div class="avatar user-avatar">👤</div>
    </ng-container>
  </div>

  <!-- Typing 指示器（不变） -->
  <div class="message-row assistant-row"
    *ngIf="isWaiting && (messages.length === 0 || messages[messages.length - 1]?.content === '')">
    <div class="avatar ai-avatar">🤖</div>
    <div class="message-bubble ai-bubble typing-bubble">
      <div class="typing-dots" aria-label="AI 正在思考">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

</div>
